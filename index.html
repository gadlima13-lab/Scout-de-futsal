<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Scout de Futsal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: club bar on top; game screen = black scoreboard band, controls, court as the main instrument, bench; lists and tables elsewhere */
:root{
  --bg:#efecec; --surface:#ffffff; --ink:#1a1415; --muted:#6a6162; --line:#ddd5d5;
  --court:#2b2e34; --court-2:#31353c; --court-line:rgba(255,255,255,.9);
  --token:#e3121b; --token-ink:#ffffff; --gk:#f4f4f4; --gk-ink:#111111;
  --board:#111111; --board-ink:#ffffff; --board-muted:#b8b1b1; --stripe:#e3121b;
  --good:#1d9a62; --bad:#b8202a; --warn:#e5b100; --shot:#7a5cf0; --neutral:#6f7f91;
  --z1:#5b8def; --z2:#1d9a62; --z3:#e5b100; --z4:#ff6a00;
  --chip:#ebe5e5;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tk:clamp(30px,7.4vw,50px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121011; --surface:#1c191a; --ink:#f0eaea; --muted:#a39a9a; --line:#322c2d;
  --court:#1f2125; --court-2:#25282d; --chip:#2a2526; --board:#070707; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121011; --surface:#1c191a; --ink:#f0eaea; --muted:#a39a9a; --line:#322c2d;
  --court:#1f2125; --court-2:#25282d; --chip:#2a2526; --board:#070707; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
#root{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 90px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--token);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{display:flex;align-items:center;gap:10px;font:700 22px/1 var(--f-num);text-transform:uppercase;letter-spacing:.03em}
.brand .flag{width:20px;height:26px;border-radius:3px 3px 10px 10px;background:repeating-linear-gradient(90deg,var(--stripe) 0 4px,#111 4px 8px);border:2px solid #111;flex:none}
.brand small{font:600 12px var(--f-body);color:var(--muted);letter-spacing:.08em}
.nav{display:flex;gap:4px;background:var(--chip);border-radius:10px;padding:4px}
.nav button,.tab{border:0;background:transparent;border-radius:7px;padding:8px 12px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.nav button[aria-current="true"],.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sync{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"]::before{background:var(--good)}
.sync[data-s="saving"]::before{background:var(--warn)}
.sync[data-s="error"]::before,.sync[data-s="readonly"]::before{background:var(--bad)}

.gamebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);padding-block:6px}
.btn.back{background:var(--board);color:var(--board-ink);border-color:var(--board);order:-1}
.gtitle{display:flex;flex-direction:column;min-width:0;flex:1 1 200px}
.gtitle b{font:700 20px/1.1 var(--f-num);text-transform:uppercase;letter-spacing:.02em}
.gtitle span{font-size:13px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn.primary{background:var(--token);border-color:var(--token);color:var(--token-ink)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;padding-inline:6px}
.btn.small{min-height:34px;padding:5px 10px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}

.note{background:var(--surface);border:1px dashed var(--muted);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px}
.note p{margin:0;flex:1 1 240px}
.confirm{background:var(--surface);border:1px solid var(--bad);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.confirm p{margin:0;flex:1 1 220px}

/* scoreboard */
.board{background:var(--board);color:var(--board-ink);border-radius:12px;padding:18px 14px 10px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;position:relative;overflow:hidden}
.board::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:repeating-linear-gradient(90deg,var(--stripe) 0 18px,var(--board) 18px 36px)}
.team{display:flex;flex-direction:column;gap:4px;min-width:0}
.team.r{align-items:flex-end;text-align:right}
.team b{font:600 13px/1.1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.team .opp{color:var(--board-muted)}
.score{font:700 clamp(32px,8vw,46px)/1 var(--f-num);font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center;justify-content:center}
.score .x{color:var(--board-muted);font-size:.6em}
.clockrow{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;border-top:1px solid rgba(255,255,255,.14);padding-top:8px}
.clock{font:700 34px/1 var(--f-num);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center;background:none;border:0;color:inherit;padding:0;cursor:pointer}
.board .chip.clkbtn{border:1px dashed rgba(255,255,255,.45);background:transparent;cursor:pointer;font:inherit;font-size:13px;font-weight:600}
.clockadj{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--token);border-radius:12px;padding:10px 12px}
.clockadj b{flex:1 1 100%;font-size:14px}
.clockadj input[type=text]{width:6.5em;font:700 20px var(--f-num);text-align:center;font-variant-numeric:tabular-nums}
.clockadj .pct{flex:1 1 100%}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.board .chip{background:rgba(255,255,255,.12);color:var(--board-ink)}
.board .chip.warn,.chip.warn{background:var(--warn);color:#1d1600}
.tt{display:inline-flex;gap:3px;align-items:center;font-size:11px;color:var(--board-muted);text-transform:uppercase;letter-spacing:.05em}
.tt i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--board-muted)}
.tt i.used{background:var(--board-ink);border-color:var(--board-ink)}

.tabs{display:flex;gap:4px;background:var(--chip);border-radius:10px;padding:4px;overflow-x:auto}
.tab{flex:1}

/* court */
.court{position:relative;width:100%;max-width:100%;aspect-ratio:2/1;border-radius:10px;user-select:none;-webkit-user-select:none}
.court svg{position:absolute;inset:0;width:100%;height:100%;border-radius:10px;display:block}
.court canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:10px;pointer-events:none}
.dir{position:absolute;right:10px;top:6px;color:var(--court-line);font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;opacity:.75;pointer-events:none}
.tok{position:absolute;width:var(--tk);height:var(--tk);transform:translate(-50%,-50%);border-radius:50%;background:var(--token);color:var(--token-ink);font:700 calc(var(--tk)*.5)/1 var(--f-num);border:2px solid rgba(0,0,0,.3);box-shadow:0 2px 6px rgba(0,0,0,.35);touch-action:none;cursor:grab;display:grid;place-items:center;padding:0;z-index:2;transition:transform .12s}
.tok.gk{background:var(--gk);color:var(--gk-ink)}
.tok.dragging{transform:translate(-50%,-50%) scale(1.18);z-index:6;cursor:grabbing;transition:none}
.tok.target{outline:3px solid #fff;outline-offset:3px}
.tok.empty{background:rgba(255,255,255,.08);border:2px dashed var(--court-line);color:#fff;box-shadow:none;cursor:default;font-size:calc(var(--tk)*.55)}
.tok.redslot{background:#111;border-color:var(--token);color:#fff;font-size:calc(var(--tk)*.34);cursor:default;font-variant-numeric:tabular-nums}
.tok .bpm{position:absolute;top:100%;left:50%;transform:translate(-50%,3px);font:700 11px/1 var(--f-num);color:#fff;background:rgba(0,0,0,.55);border-radius:4px;padding:2px 4px;white-space:nowrap;pointer-events:none}
.card{position:absolute;top:-4px;right:-3px;width:10px;height:14px;border-radius:2px;background:var(--warn);border:1px solid rgba(0,0,0,.3)}
.mark{position:absolute;width:18px;height:18px;border-radius:50%;border:3px solid #fff;transform:translate(-50%,-50%);pointer-events:none;z-index:1;box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;width:var(--tk);height:var(--tk);margin:calc(var(--tk)/-2) 0 0 calc(var(--tk)/-2);border-radius:50%;background:var(--token);color:var(--token-ink);font:700 calc(var(--tk)*.5)/1 var(--f-num);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.4);border:2px solid rgba(0,0,0,.28)}
.ghost.gk{background:var(--gk);color:var(--gk-ink)}
.hint{margin:0;color:var(--muted);font-size:13.5px;max-width:72ch}

.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.section-h h2{font:700 15px var(--f-body);text-transform:uppercase;letter-spacing:.07em}
.section-h span{color:var(--muted);font-size:13px}
.bench{display:flex;flex-wrap:wrap;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.btok{display:flex;flex-direction:column;align-items:center;gap:3px;width:68px;background:none;border:0;padding:2px;cursor:grab;touch-action:none}
.ball{width:var(--tk);height:var(--tk);border-radius:50%;background:var(--token);color:var(--token-ink);font:700 calc(var(--tk)*.5)/1 var(--f-num);display:grid;place-items:center;border:2px solid rgba(0,0,0,.25);position:relative;flex:none}
.gk>.ball,.ball.gk{background:var(--gk);color:var(--gk-ink)}
.btok .nm{font-size:12px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btok .mn{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.btok:disabled{cursor:default;opacity:.5}
.btok:disabled .ball{background:var(--bad);color:#fff}
.btok.dim{opacity:.35}
.last{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;min-height:42px}
.last b{font-variant-numeric:tabular-nums}

/* action menu */
.menu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.3);padding:8px;width:250px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.menu h3{grid-column:1/-1;margin:2px 4px 4px;font:700 15px var(--f-body)}
.menu h3 small{color:var(--muted);font-weight:500}
.act{border:0;border-radius:8px;padding:10px 6px 10px 9px;font-weight:600;font-size:13.5px;cursor:pointer;background:var(--chip);border-left:4px solid var(--c,var(--neutral));text-align:left;min-height:42px}
.act.cancel{grid-column:1/-1;border-left:0;text-align:center;color:var(--muted);background:transparent;border:1px solid var(--line)}

/* tables */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
th:nth-child(2),td:nth-child(2){text-align:left}
td:first-child,th:first-child{text-align:center}
tr.total td{font-weight:700;border-bottom:0}
tr.off td{color:var(--muted)}
.num{font:700 17px var(--f-num)}
.pct{color:var(--muted);font-size:12px;margin-left:3px}
.ycard,.rcard{display:inline-block;width:9px;height:12px;border-radius:2px;background:var(--warn);vertical-align:-1px;margin-left:2px}
.rcard{background:var(--bad)}
.foot{color:var(--muted);font-size:12.5px;margin:0;max-width:80ch}

/* map */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
select,input[type=text],input[type=number],input[type=date]{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px;text-transform:none;letter-spacing:0;width:100%}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:6px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.thirds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.third{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.third .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.third .v{font:700 24px var(--f-num);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--chip);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--token)}

/* log */
.log{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.log li{display:grid;grid-template-columns:72px 1fr auto;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center}
.log li:last-child{border-bottom:0}
.log .t{font:600 15px var(--f-num);font-variant-numeric:tabular-nums;color:var(--muted)}
.log .e{border-left:4px solid var(--c,var(--neutral));padding-left:9px;min-width:0}
.xbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;padding:6px 8px;border-radius:6px}
.xbtn:hover{color:var(--bad)}
.empty{padding:22px;color:var(--muted);text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:12px}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left;cursor:pointer;width:100%}
.item:hover{border-color:var(--muted)}
.item .d{font:700 15px/1.1 var(--f-num);text-transform:uppercase;color:var(--muted);text-align:center;min-width:46px}
.item .d b{display:block;font-size:24px;color:var(--ink)}
.item .m{min-width:0}
.item .m b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m span{font-size:13px;color:var(--muted)}
.res{font:700 22px var(--f-num);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.pill{font:700 12px var(--f-body);border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--ink);text-transform:uppercase;letter-spacing:.04em}
.pill.v{background:var(--good);color:#fff}.pill.d{background:var(--bad);color:#fff}.pill.e{background:var(--neutral);color:#fff}
.pill.live{background:var(--token);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font:700 26px/1.1 var(--f-num);font-variant-numeric:tabular-nums}

/* roster */
.prow{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.prow.inactive{opacity:.55}
.prow .m b{display:block}
.prow .m span{font-size:13px;color:var(--muted)}
.form{background:var(--surface);border:1px solid var(--token);border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.form .full{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;font-weight:600;min-height:42px}
.check input{width:20px;height:20px;accent-color:var(--token)}

/* setup */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer;font-weight:600}
.pchip .ball{--tk:30px}
.pchip[aria-pressed="true"]{border-color:var(--token)}
.pchip.off{opacity:.45}
.pchip .tag{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pchip.starter{background:var(--token);border-color:var(--token);color:#fff}
.pchip.starter .tag{color:rgba(255,255,255,.85)}

/* physical */
.phys{display:flex;flex-direction:column;gap:8px}
.prow2{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.prow2 .hd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;min-width:0}
.prow2 .hd b{font-size:15px}
.live{font:700 22px/1 var(--f-num);font-variant-numeric:tabular-nums}
.live small{font-size:12px;color:var(--muted);font-family:var(--f-body);font-weight:600}
.metrics{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.metrics b{color:var(--ink);font-variant-numeric:tabular-nums}
.spark{grid-column:1/-1;width:100%;height:56px;display:block}
.fileb{position:relative;overflow:hidden}
.fileb input{position:absolute;inset:0;opacity:0;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* minutagem (planilha do preparador físico) */
.mt table{font-size:13px}
.mt th,.mt td{text-align:center;border:1px solid var(--line);padding:5px 7px;font-weight:700}
.mt td:first-child,.mt th:first-child{text-align:left;min-width:120px}
.mt .ttl{background:var(--token);color:#fff;font:700 16px var(--f-num);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.mt th{font-size:12px;color:var(--ink)}
.mt th.e{color:var(--token)}
.mt td.blank{background:var(--chip)}
.mt td.tot{background:var(--surface)}
.mt th.geral,.mt td.geral{background:var(--token);color:#fff}
.mt tr.zero td{color:var(--muted)}
.mtfoot{background:var(--token);color:#fff;font:700 15px var(--f-num);text-transform:uppercase;letter-spacing:.06em;text-align:center;border-radius:8px;padding:8px}
.staff{display:flex;flex-wrap:wrap;gap:8px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.staff label{flex:1 1 220px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:70;max-width:calc(100% - 32px);box-shadow:0 6px 18px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:reduce){.tok{transition:none}}
@media (max-width:520px){.btok{width:58px}.clock{font-size:30px}.prow{grid-template-columns:auto 1fr auto}.prow .fc{display:none}.log li{grid-template-columns:64px 1fr auto}}
</style>

<div id="root"></div>
<div class="menu" id="menu" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
/*MODEL*/
const PERIOD = 1200, BIN = 5;
const POS = ['GOL','FIXO','ALA','PIVÔ'];
const SLOT_POS = [{x:.07,y:.5},{x:.3,y:.5},{x:.5,y:.2},{x:.5,y:.8},{x:.74,y:.5}];
const ACTIONS = [
  {k:'passe_ok',l:'Passe certo',c:'var(--good)'},
  {k:'passe_err',l:'Passe errado',c:'var(--bad)'},
  {k:'chute_gol',l:'Chute no gol',c:'var(--shot)'},
  {k:'chute_fora',l:'Chute fora',c:'var(--shot)'},
  {k:'gol',l:'Gol',c:'var(--token)'},
  {k:'assist',l:'Assistência',c:'var(--token)'},
  {k:'desarme',l:'Desarme',c:'var(--good)'},
  {k:'falta_s',l:'Falta sofrida',c:'var(--neutral)'},
  {k:'falta_c',l:'Falta cometida',c:'var(--bad)'},
  {k:'amarelo',l:'Amarelo',c:'var(--warn)'},
  {k:'vermelho',l:'Vermelho',c:'var(--bad)'},
  {k:'defesa',l:'Defesa',c:'var(--good)',gk:true}
];
const A = Object.fromEntries(ACTIONS.map(a=>[a.k,a]));
Object.assign(A,{
  sub:{l:'Substituição',c:'var(--muted)'}, gol_adv:{l:'Gol do adversário',c:'var(--bad)'},
  falta_adv:{l:'Falta do adversário',c:'var(--neutral)'}, tt_us:{l:'Tempo técnico',c:'var(--muted)'}, tt_adv:{l:'Tempo técnico do adversário',c:'var(--muted)'}
});
const DELETABLE = ['passe_ok','passe_err','chute_gol','chute_fora','gol','assist','desarme','falta_s','falta_c','defesa','gol_adv','falta_adv'];

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function gnow(g){ const c=g.clock; return c.since ? Math.min(2*PERIOD, c.elapsed+(Date.now()-c.since)/1000) : c.elapsed; }
const lineup = g => g.slots.filter(s=>s.pid).map(s=>s.pid);
function push(g,e){ e.id=++g.seq; e.period=g.period; g.events.push(e); return e; }
function closeStint(g,pid,t){ const s=g.stints[pid]; if(s&&s.length&&s[s.length-1][1]===null) s[s.length-1][1]=t; }
function openStint(g,pid,t){ (g.stints[pid] ||= []).push([t,null]); }
function doRecord(g,pid,k,x,y,t){
  const ev=push(g,{t,pid,type:k,x,y});
  if(k==='gol'){ g.score.us++; ev.on=lineup(g); }
  if(k==='amarelo'){ g.yellows[pid]=(g.yellows[pid]||0)+1; if(g.yellows[pid]>=2){ push(g,{t,pid,type:'vermelho',x,y,second:true}); expel(g,pid,t); } }
  if(k==='vermelho') expel(g,pid,t);
  return ev;
}
function expel(g,pid,t){
  closeStint(g,pid,t); g.expelled[pid]=true;
  const s=g.slots.find(s=>s.pid===pid); if(s){ s.pid=null; s.red={until:t+120}; }
}
function doSub(g,i,inPid,t){
  const s=g.slots[i], out=s.pid;
  if(out) closeStint(g,out,t);
  openStint(g,inPid,t); s.pid=inPid;
  push(g,{t,pid:inPid,type:'sub',out});
}
function doOppGoal(g,t){
  g.score.them++; const ev=push(g,{t,type:'gol_adv'}); ev.on=lineup(g);
  g.slots.forEach(s=>{ if(s.red) s.red=null; });
}
function isOn(g,pid,t){ return (g.stints[pid]||[]).some(([i,o])=>i<=t&&(o===null||o>t)); }
function onAt(g,t){ return Object.keys(g.stints).filter(id=>isOn(g,id,t)); }
function minutes(g,pid,t){ return (g.stints[pid]||[]).reduce((a,[i,o])=>a+Math.max(0,(o??t)-i),0); }
const countType = (g,type,p) => g.events.filter(e=>e.type===type&&e.period===p).length;

function newGame(o){
  const players=o.squad.map(p=>({id:p.id,num:p.num,name:p.name,pos:p.pos,fcmax:p.fcmax||195}));
  const st=o.starters.map(id=>players.find(p=>p.id===id)).filter(Boolean).sort((a,b)=>POS.indexOf(a.pos)-POS.indexOf(b.pos));
  const slots=SLOT_POS.map((p,i)=>({pid:st[i]?st[i].id:null,x:p.x,y:p.y,red:null}));
  const g={id:o.id||uid(),opp:o.opp,comp:o.comp||'',date:o.date,venue:o.venue||'Casa',status:'live',players,slots,
    stints:{},yellows:{},expelled:{},events:[],seq:0,period:1,clock:{elapsed:0,since:null,log:[]},score:{us:0,them:0},hr:{},
    createdAt:Date.now(),updatedAt:Date.now()};
  slots.forEach(s=>{ if(s.pid) g.stints[s.pid]=[[0,null]]; });
  return g;
}

function computeStats(g,t){
  const st={};
  g.players.forEach(p=>st[p.id]={min:minutes(g,p.id,t),gol:0,ast:0,gf:0,gs:0,fin:0,alvo:0,pok:0,perr:0,des:0,fc:0,fs:0,ama:0,ver:0,def:0});
  g.events.forEach(e=>{
    if(e.type==='gol'||e.type==='gol_adv') (e.on||onAt(g,e.t)).forEach(id=>{ if(st[id]) st[id][e.type==='gol'?'gf':'gs']++; });
    const s=st[e.pid]; if(!s) return;
    switch(e.type){
      case 'gol': s.gol++; s.fin++; s.alvo++; break;
      case 'chute_gol': s.fin++; s.alvo++; break;
      case 'chute_fora': s.fin++; break;
      case 'assist': s.ast++; break;
      case 'passe_ok': s.pok++; break; case 'passe_err': s.perr++; break;
      case 'desarme': s.des++; break; case 'falta_c': s.fc++; break; case 'falta_s': s.fs++; break;
      case 'amarelo': s.ama++; break; case 'vermelho': s.ver++; break; case 'defesa': s.def++; break; }
  });
  return st;
}
function hrMetrics(g,pid){
  const bins=g.hr&&g.hr[pid]; if(!bins||!bins.some(v=>v)) return null;
  const p=g.players.find(x=>x.id===pid), fm=(p&&p.fcmax)||195;
  const on=[], all=[];
  bins.forEach((v,i)=>{ if(!v) return; all.push(v); if(isOn(g,pid,i*BIN+BIN/2)) on.push(v); });
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  const st=g.stints[pid]||[], rec=[];
  for(let k=0;k<st.length-1;k++){
    const out=st[k][1], back=st[k+1][0]; if(out===null||back-out<20) continue;
    const b0=Math.floor(out/BIN), b1=Math.floor(back/BIN)-1;
    const v0=bins[b0]||bins[b0-1], v1=bins[b1]||bins[b1-1];
    if(v0&&v1) rec.push(v0-v1);
  }
  return {avgOn:avg(on),max:Math.max(...all),highPct:on.length?Math.round(on.filter(v=>v>=.85*fm).length*100/on.length):null,
    rec:rec.length?Math.round(rec.reduce((a,b)=>a+b,0)/rec.length):null,dataMin:Math.round(all.length*BIN/60)};
}

/* Minutagem: entradas e saídas por tempo no relógio regressivo (20:00 → 0:00), como na planilha do preparador físico */
const fmtC=s=>{ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
function minutagem(g){
  const t=gnow(g);
  const players=g.players.slice().sort((a,b)=>((a.pos==='GOL'?0:1)-(b.pos==='GOL'?0:1))||a.num-b.num);
  const halves=[1,2].map(h=>{
    const P=(h-1)*PERIOD, E=P+PERIOD;
    const rows=players.map(p=>{
      const pairs=[]; let tot=0;
      (g.stints[p.id]||[]).forEach(([i,o])=>{
        const ent=Math.max(i,P);
        if(ent>=E||ent>t) return;
        if(o!==null&&o<=P) return;
        const end=Math.min(o===null?t:o,E);
        tot+=Math.max(0,end-ent);
        pairs.push([E-ent,(o!==null&&o<E)?E-o:null]);
      });
      return {p,pairs,tot};
    });
    return {h,rows,maxPairs:Math.max(0,...rows.map(r=>r.pairs.length))};
  });
  const geral={}; players.forEach((p,k)=>geral[p.id]=halves[0].rows[k].tot+halves[1].rows[k].tot);
  return {players,halves,geral,pairs:Math.max(8,halves[0].maxPairs,halves[1].maxPairs)};
}
/* Elenco do Campo Mourão (goleiros primeiro, como na planilha de minutagem) */
const ROSTER_CM=[[2,'Françoar','GOL'],[23,'Canton','GOL'],[34,'Léo','GOL'],[3,'Gui Lima'],[6,'Selbach'],[10,'Jabá'],[11,'Luan'],[15,'Renan'],[16,'Kaue'],[18,'Tom'],[30,'Samuel'],[33,'Kaduzin'],[77,'Jhony'],[78,'Pebinha']];
function realClub(prev){
  return {name:'Campo Mourão',example:false,preparador:(prev&&prev.preparador!==undefined)?prev.preparador:'Rafael Fontanella',updatedAt:Date.now(),
    players:ROSTER_CM.map(([n,name,pos])=>({id:'cm'+String(n).padStart(2,'0'),num:n,name,pos:pos||'ALA',fcmax:195,active:true}))};
}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sampleClub(){
  const P=(n,name,pos,fc)=>({id:'p'+n,num:n,name,pos,fcmax:fc,active:true});
  return {name:'Campo Mourão',example:true,updatedAt:Date.parse('2026-10-11T22:00:00Z'),players:[
    P(1,'Rafael','GOL',188),P(12,'Thiago','GOL',191),P(2,'Lucas','FIXO',194),P(4,'Mateus','FIXO',197),P(6,'João','FIXO',192),
    P(5,'Diego','ALA',198),P(7,'Bruno','ALA',196),P(8,'Caio','ALA',200),P(10,'Gabriel','ALA',195),P(14,'Henrique','ALA',199),
    P(9,'Pedro','PIVÔ',193),P(11,'Vitor','PIVÔ',196)]};
}
function sampleGame(club){
  const r=mulberry(23), rr=(a,b)=>a+r()*(b-a), pick=a=>a[Math.floor(r()*a.length)];
  const g=newGame({id:'exemplo-1',opp:'Time Exemplo',comp:'Jogo de exemplo',date:'2026-10-11',venue:'Casa',squad:club.players,starters:['p1','p2','p5','p10','p9']});
  g.example=true;
  const P=id=>g.players.find(p=>p.id===id);
  const field=()=>g.slots.map((s,i)=>({s,i})).filter(o=>o.s.pid&&o.i>0);
  const sched=[];
  [233,701,1490,2105].forEach(t=>sched.push([t,'gol']));
  [512,1820,2290].forEach(t=>sched.push([t,'gol_adv']));
  [150,388,760,1330,1710,1960,2210].forEach(t=>sched.push([t,'falta']));
  [620,1580,2040].forEach(t=>sched.push([t,'falta_adv']));
  sched.push([1650,'amarelo'],[1200,'gk'],[905,'tt_us'],[1750,'tt_adv']);
  let ts=175; while(ts<2370){ sched.push([Math.round(ts),'rot']); ts+=rr(150,240); }
  sched.sort((a,b)=>a[0]-b[0]);
  const apply=([t,k])=>{
    g.period=t>=PERIOD?2:1;
    const fo=field();
    if(k==='gol'){ const sc=pick(fo), as=pick(fo.filter(o=>o!==sc));
      doRecord(g,as.s.pid,'assist',+rr(.6,.8).toFixed(3),+rr(.15,.85).toFixed(3),t);
      doRecord(g,sc.s.pid,'gol',+rr(.82,.93).toFixed(3),+rr(.38,.62).toFixed(3),t); }
    else if(k==='gol_adv') doOppGoal(g,t);
    else if(k==='falta'){ const o=pick(fo); doRecord(g,o.s.pid,'falta_c',+rr(.2,.6).toFixed(3),+rr(.1,.9).toFixed(3),t); }
    else if(k==='falta_adv') push(g,{t,type:'falta_adv'});
    else if(k==='tt_us'||k==='tt_adv') push(g,{t,type:k});
    else if(k==='amarelo'){ const o=pick(fo); doRecord(g,o.s.pid,'amarelo',+rr(.3,.5).toFixed(3),+rr(.2,.8).toFixed(3),t); }
    else if(k==='gk') doSub(g,0,'p12',t);
    else if(k==='rot'){ const since=id=>{ const s=g.stints[id]; return s[s.length-1][0]; }; const o=fo.slice().sort((a,b)=>since(a.s.pid)-since(b.s.pid))[r()<.75?0:1]; const bench=g.players.filter(p=>p.pos!=='GOL'&&!lineup(g).includes(p.id)&&!g.expelled[p.id]);
      if(!bench.length) return; bench.sort((a,b)=>minutes(g,a.id,t)-minutes(g,b.id,t)); doSub(g,o.i,bench[0].id,t); }
  };
  const baseX={GOL:.07,FIXO:.32,ALA:.5,'PIVÔ':.72};
  let t=4, si=0;
  while(t<2400){
    while(si<sched.length&&sched[si][0]<=t) apply(sched[si++]);
    g.period=t>=PERIOD?2:1;
    const live=g.slots.map((s,i)=>({s,i})).filter(o=>o.s.pid);
    const w=live.map(o=>P(o.s.pid).pos==='GOL'?.35:1), tot=w.reduce((a,b)=>a+b,0);
    let q=r()*tot, o=live[0]; for(let j=0;j<live.length;j++){ q-=w[j]; if(q<=0){o=live[j];break;} }
    const pl=P(o.s.pid), bx=baseX[pl.pos], by=SLOT_POS[o.i].y; let k,x,y;
    if(pl.pos==='GOL'){ const z=r(); k=z<.6?'passe_ok':z<.75?'passe_err':'defesa';
      x=k==='defesa'?rr(.03,.1):rr(.04,.22); y=k==='defesa'?rr(.38,.62):rr(.2,.8); }
    else { const sw=pl.pos==='PIVÔ'?.24:pl.pos==='ALA'?.14:.07, z=r();
      k=z<.48?'passe_ok':z<.61?'passe_err':z<.74?'desarme':z<.74+sw?(r()<.45?'chute_gol':'chute_fora'):'falta_s';
      if(k.startsWith('chute')){ x=rr(.62,.93); y=rr(.25,.75); }
      else if(k==='desarme'){ x=Math.min(.8,Math.max(.08,bx-.08+rr(-.15,.15))); y=Math.min(.95,Math.max(.05,by+rr(-.2,.2))); }
      else { x=Math.min(.95,Math.max(.08,bx+rr(-.2,.2)+(k==='falta_s'?.08:0))); y=Math.min(.95,Math.max(.05,by+rr(-.22,.22))); } }
    doRecord(g,pl.id,k,+x.toFixed(3),+y.toFixed(3),Math.round(t));
    t+=rr(6,15);
  }
  while(si<sched.length) apply(sched[si++]);
  g.period=2; lineup(g).forEach(id=>closeStint(g,id,2400));
  const T0=Date.parse('2026-10-11T22:05:00Z');
  g.clock={elapsed:2400,since:null,log:[{r0:T0,g0:0,r1:T0+1200e3},{r0:T0+2400e3,g0:1200,r1:T0+3600e3}]};
  g.status='final';
  g.players.forEach(p=>{
    if(!g.stints[p.id]) return;
    const bins=[]; let cur=96;
    for(let i=0;i<480;i++){ const tt=i*BIN+2.5, on=isOn(g,p.id,tt);
      const tgt=on?p.fcmax*(p.pos==='GOL'?rr(.66,.8):rr(.79,.94)):118+rr(-6,8);
      cur+=(tgt-cur)*(on?.3:.09)+rr(-2.5,2.5); bins.push(Math.round(Math.min(p.fcmax,cur))); }
    g.hr[p.id]=bins;
  });
  g.createdAt=g.updatedAt=Date.parse('2026-10-11T23:10:00Z');
  return g;
}
/*END MODEL*/

/* ---------- shared sync (db capability) ---------- */
const SY={db:null,state:'local',pending:new Set(),ver:{},timers:{},writing:new Set(),readonly:false,firstGames:false};
function setSync(s){ SY.state=s; const el=$('#sync'); if(el){ el.dataset.s=s; el.textContent=syncLabel(); } }
function syncLabel(){ return ({ok:'Sincronizado',saving:'Salvando…',local:'Salvo neste aparelho',error:'Sem conexão · salvo no aparelho',readonly:'Somente leitura',connecting:'Conectando…'})[SY.state]||''; }
function queueWrite(path){
  if(!SY.db||SY.readonly) return;
  SY.pending.add(path); SY.ver[path]=(SY.ver[path]||0)+1;
  clearTimeout(SY.timers[path]); SY.timers[path]=setTimeout(()=>flush(path),1200);
  setSync('saving');
}
async function flush(path){
  if(SY.writing.has(path)){ SY.timers[path]=setTimeout(()=>flush(path),600); return; }
  const v=SY.ver[path]; SY.writing.add(path);
  try{
    const ref=SY.db.doc(path);
    let data=null;
    if(path==='clube/principal') data=S.club;
    else data=S.games[path.split('/')[1]];
    if(data){ const body=clone(data); delete body.synced; await ref.set(body); if(path!=='clube/principal'&&S.games[data.id]){ S.games[data.id].synced=true; saveLocal(); } }
    else await ref.delete();
    if(SY.ver[path]===v) SY.pending.delete(path);
    if(!SY.pending.size) setSync('ok');
  }catch(e){
    if(e.code==='invalid_argument'){ SY.readonly=true; setSync('readonly'); toast('Você pode ver os dados, mas não tem permissão para salvar alterações para a equipe.'); }
    else if(e.code==='quota_exceeded'){ setSync('error'); toast('Espaço de armazenamento cheio. Apague jogos antigos de exemplo.'); }
    else { setSync('error'); SY.timers[path]=setTimeout(()=>flush(path),5000+Math.random()*3000); }
  }finally{ SY.writing.delete(path); }
}
async function initSync(){
  if(!window.claude||!window.claude.use){ setSync('local'); return; }
  setSync('connecting');
  let db=null; try{ db=await window.claude.use('db'); }catch(e){}
  if(!db){ setSync('local'); return; }
  SY.db=db; setSync('ok');
  db.doc('clube/principal').onSnapshot(snap=>{
    if(snap.exists){
      const r=snap.data();
      if(!SY.pending.has('clube/principal')&&(!S.club||(r.updatedAt||0)>(S.club.updatedAt||0))){ S.club=clone(r); saveLocal(); softRender(); }
    } else if(S.club&&!snap.metadata.fromCache) queueWrite('clube/principal');
  },()=>setSync('error'));
  db.collection('jogos').onSnapshot(qs=>{
    let changed=false; const seen=new Set();
    qs.docs.forEach(d=>{
      seen.add(d.id); const path='jogos/'+d.id; if(SY.pending.has(path)) return;
      const r=d.data(), l=S.games[d.id];
      if(!l||(r.updatedAt||0)>(l.updatedAt||0)){ S.games[d.id]=Object.assign(clone(r),{synced:true}); changed=true; }
      else if(l&&!l.synced){ l.synced=true; }
    });
    qs.docChanges().forEach(c=>{ if(c.type==='removed'){ const id=c.doc.id; if(!SY.pending.has('jogos/'+id)&&S.games[id]){ delete S.games[id]; changed=true; } } });
    if(!qs.metadata.fromCache&&!SY.firstGames){
      SY.firstGames=true;
      Object.keys(S.games).forEach(id=>{ if(seen.has(id)) return; if(S.games[id].synced){ delete S.games[id]; changed=true; } else queueWrite('jogos/'+id); });
    }
    if(changed){ saveLocal(); softRender(); }
  },()=>setSync('error'));
}
function touchGame(g){ g.updatedAt=Date.now(); saveLocal(); queueWrite('jogos/'+g.id); }
function touchClub(){ S.club.updatedAt=Date.now(); saveLocal(); queueWrite('clube/principal'); }

/* ---------- mutations ---------- */
function snapshot(g){ const c=clone(g); delete c.clock; delete c.hr; return JSON.stringify(c); }
function mutate(g,fn,opt={}){
  if(opt.undo!==false){ const st=(undoStacks[g.id] ||= []); st.push(snapshot(g)); if(st.length>80) st.shift(); }
  fn(); touchGame(g); render();
}
function doUndo(g){
  const st=undoStacks[g.id]; if(!st||!st.length) return;
  const prev=JSON.parse(st.pop()); const keep={clock:g.clock,hr:g.hr};
  Object.keys(g).forEach(k=>delete g[k]); Object.assign(g,prev,keep);
  touchGame(g); render(); toast('Último registro desfeito');
}

/* ---------- clock ---------- */
function startClock(g){ g.clock.since=Date.now(); g.clock.log.push({r0:g.clock.since,g0:g.clock.elapsed,r1:null}); }
function stopClock(g,at){
  if(!g.clock.since) return;
  const t=at??gnow(g); const seg=g.clock.log[g.clock.log.length-1];
  g.clock.elapsed=t; g.clock.since=null;
  if(seg&&seg.r1===null) seg.r1=seg.r0+(t-seg.g0)*1000;
}
function setClockRemaining(g,rem){
  rem=Math.max(0,Math.min(PERIOD,Math.round(rem)));
  const nt=g.period*PERIOD-rem, running=!!g.clock.since;
  if(running){ stopClock(g); g.clock.elapsed=nt; startClock(g); } else g.clock.elapsed=nt;
  touchGame(g); render();
}
function gameTimeAtReal(g,r){
  for(const s of g.clock.log){ const end=s.r1??Date.now(); if(r>=s.r0&&r<=end) return s.g0+(r-s.r0)/1000; }
  return null;
}

/* ---------- heart rate (Polar) ---------- */
const BT={live:{},sensors:{},acc:{},dirty:false};
const btPolicyOk=()=>{ try{ return !document.featurePolicy||document.featurePolicy.allowsFeature('bluetooth'); }catch(e){ return true; } };
const btReady=()=>!!navigator.bluetooth&&btPolicyOk();
function zoneColor(bpm,fm){ const p=bpm/(fm||195); return p>=.9?'var(--z4)':p>=.8?'var(--z3)':p>=.7?'var(--z2)':'var(--z1)'; }
function parseHR(dv){ const f=dv.getUint8(0); return f&1?dv.getUint16(1,true):dv.getUint8(1); }
async function connectHR(pid){
  if(!navigator.bluetooth){ toast('Este navegador não tem Bluetooth. Use o Chrome no Android ou no computador.'); return; }
  try{
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:['heart_rate']}]});
    const srv=await dev.gatt.connect(); const svc=await srv.getPrimaryService('heart_rate');
    const ch=await svc.getCharacteristic('heart_rate_measurement'); await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged',ev=>onHR(pid,parseHR(ev.target.value)));
    dev.addEventListener('gattserverdisconnected',()=>{ if(BT.sensors[pid]){ BT.sensors[pid].lost=true; delete BT.live[pid]; softRender(); toast('Um sensor desconectou. Toque em Conectar para religar.'); } });
    BT.sensors[pid]={dev,name:dev.name||'Sensor'}; render(); toast(`Sensor ${dev.name||''} conectado`);
  }catch(e){
    if(e.name==='NotFoundError') return;
    if(e.name==='SecurityError'||e.name==='NotAllowedError') toast('Esta página não tem permissão para Bluetooth. Abra a versão instalada do app.');
    else toast('Não foi possível conectar o sensor: '+e.message);
  }
}
function disconnectHR(pid){ const s=BT.sensors[pid]; try{ s&&s.dev.gatt.disconnect(); }catch(e){} delete BT.sensors[pid]; delete BT.live[pid]; render(); }
function onHR(pid,bpm){
  if(!(bpm>30)) return; BT.live[pid]={bpm,ts:Date.now()};
  const g=cur(); if(!g||!g.clock.since||!g.players.some(p=>p.id===pid)) return;
  const b=Math.floor(gnow(g)/BIN); const a=((BT.acc[g.id] ||= {})[pid] ||= {});
  const c=(a[b] ||= {s:0,n:0}); c.s+=bpm; c.n++;
  (g.hr[pid] ||= [])[b]=Math.round(c.s/c.n); BT.dirty=true;
}
function parseDT(d,t){
  if(!d||!t) return null; let y,m,dd; let mm;
  if((mm=d.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) [,y,m,dd]=mm; else if((mm=d.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/))) [,dd,m,y]=mm; else return null;
  const tm=t.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/); if(!tm) return null;
  return new Date(+y,+m-1,+dd,+tm[1],+tm[2],+(tm[3]||0)).getTime();
}
function hms(s){ const m=String(s||'').match(/^(\d{1,2}):(\d{2}):(\d{2})/); return m?(+m[1])*3600+(+m[2])*60+(+m[3]):null; }
function parsePolar(text){
  const lines=text.split(/\r?\n/).map(l=>l.split(/[;,]/).map(c=>c.trim().replace(/^"|"$/g,'')));
  let start=null;
  for(let i=0;i<lines.length-1&&start===null;i++){
    const h=lines[i].map(c=>c.toLowerCase()); const di=h.findIndex(c=>c==='date'||c==='data'); const si=h.findIndex(c=>c==='start time'||c.startsWith('hora de in'));
    if(di>=0&&si>=0) start=parseDT(lines[i+1][di],lines[i+1][si]);
  }
  let hi=-1,ti=-1,bi=-1;
  for(let i=0;i<lines.length;i++){
    const h=lines[i].map(c=>c.toLowerCase()); const t=h.findIndex(c=>c==='time'||c==='tempo'); const b=h.findIndex(c=>/^(hr|fc)\b|bpm/.test(c));
    if(t>=0&&b>=0){ hi=i;ti=t;bi=b;break; }
  }
  if(start===null||hi<0) return null;
  const out=[]; for(let i=hi+1;i<lines.length;i++){ const row=lines[i]; const sec=hms(row[ti]), bpm=parseInt(row[bi],10); if(sec===null||!(bpm>30)) continue; out.push([start+sec*1000,bpm]); }
  return out.length?out:null;
}
async function importHR(pid,file){
  const g=cur(); if(!g) return;
  let samples=null; try{ samples=parsePolar(await file.text()); }catch(e){}
  if(!samples){ toast('Arquivo não reconhecido. Use o CSV exportado do treino no Polar Flow.'); return; }
  const acc={}; let n=0;
  samples.forEach(([real,bpm])=>{ const gt=gameTimeAtReal(g,real); if(gt===null||gt<0||gt>=2*PERIOD) return; const b=Math.floor(gt/BIN); (acc[b] ||= {s:0,n:0}); acc[b].s+=bpm; acc[b].n++; n++; });
  if(!n){ toast('O horário do arquivo não bate com o horário em que o cronômetro deste jogo rodou.'); return; }
  mutate(g,()=>{ const arr=[]; Object.entries(acc).forEach(([b,v])=>arr[+b]=Math.round(v.s/v.n)); g.hr[pid]=arr; },{undo:false});
  toast(`${Math.max(1,Math.round(n/60))} min de frequência cardíaca importados`);
}

let dlCap=null;
async function saveFile(name,data){
  if(window.claude&&window.claude.use){
    if(!dlCap) dlCap=await window.claude.use('downloads');
    if(!dlCap){ toast('Download indisponível nesta visualização.'); return; }
    try{ await dlCap.save({filename:name,data}); }catch(e){ if(e.code!=='declined') toast('Não foi possível salvar o arquivo.'); }
    return;
  }
  const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data])); const a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function describePlain(g,e){

/* ---------- views ---------- */
function topbar(){
  const nav=[['home','Jogos'],['roster','Elenco'],['season','Temporada']];
  return `<header class="topbar"><div class="brand"><span class="flag"></span><span>${esc(clubName())}<br><small>Scout de futsal</small></span></div>
  <nav class="nav">${nav.map(([v,l])=>`<button data-act="go" data-v="${v}" aria-current="${UI.view===v}">${l}</button>`).join('')}</nav>
  <span class="sync" id="sync" data-s="${SY.state}">${syncLabel()}</span></header>`;
}
function confirmBox(kind,text,yes){
  if(!UI.confirm||UI.confirm.kind!==kind) return '';
  return `<div class="confirm"><p>${text}</p><button class="btn danger" data-act="confirm-yes">${yes}</button><button class="btn" data-act="confirm-no">Cancelar</button></div>`;
}
function result(g){ return g.score.us>g.score.them?'v':g.score.us<g.score.them?'d':'e'; }
function viewHome(){
  const games=Object.values(S.games).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.createdAt-a.createdAt);
  const fin=games.filter(g=>g.status==='final');
  const k={j:fin.length,v:fin.filter(g=>result(g)==='v').length,e:fin.filter(g=>result(g)==='e').length,d:fin.filter(g=>result(g)==='d').length,gp:fin.reduce((a,g)=>a+g.score.us,0),gc:fin.reduce((a,g)=>a+g.score.them,0)};
  let h=`<div class="section-h"><h2>Jogos</h2><button class="btn primary" data-act="new-game">Novo jogo</button></div>`;
  if(!S.club||!S.club.players.length) h+=`<div class="note"><p>Comece cadastrando o elenco. Depois é só criar o jogo, escolher convocados e titulares.</p><button class="btn" data-act="go" data-v="roster">Cadastrar elenco</button></div>`;
  if(fin.length) h+=`<div class="kpis">${[['Jogos',k.j],['Vitórias',k.v],['Empates',k.e],['Derrotas',k.d],['Gols pró',k.gp],['Gols contra',k.gc]].map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('')}</div>`;
  if(!games.length) h+=`<div class="empty">Nenhum jogo ainda. Toque em <b>Novo jogo</b> para começar o primeiro scout.</div>`;
  else h+=`<div class="list">${games.map(g=>{ const [y,m,d]=(g.date||'--').split('-'); const r=result(g);
    return `<button class="item" data-act="open-game" data-id="${esc(g.id)}"><span class="d"><b>${d||''}</b>${MESES[+m-1]||''}</span>
      <span class="m"><b>${esc(clubName())} × ${esc(g.opp)}</b><span>${esc(g.comp||'Sem competição')} · ${g.venue}${g.example?' · exemplo':''}</span></span>
      <span class="res">${g.score.us}–${g.score.them}${g.status==='final'?`<span class="pill ${r}">${r==='v'?'V':r==='d'?'D':'E'}</span>`:'<span class="pill live">Ao vivo</span>'}</span></button>`; }).join('')}</div>`;
  return h;
}
function viewRoster(){
  const ps=(S.club?S.club.players:[]).slice().sort(sortP);
  let h=`<div class="section-h"><h2>Elenco</h2><button class="btn primary" data-act="add-player">Adicionar atleta</button></div>`;
  if(S.club&&S.club.example) h+=`<div class="note"><p>Estes atletas são de exemplo. Cadastre o elenco real do ${esc(clubName())} e apague os de exemplo. Os jogos já feitos guardam os nomes da época.</p><button class="btn danger" data-act="clear-example">Apagar atletas de exemplo</button></div>`;
  h+=confirmBox('clear-example','Apagar todos os atletas de exemplo do elenco?','Apagar');
  if(UI.edit) h+=editForm();
  h+=confirmBox('del-player','Remover este atleta do elenco? Os jogos antigos continuam com ele.','Remover');
  if(!ps.length&&!UI.edit) h+=`<div class="empty">Nenhum atleta cadastrado. Toque em <b>Adicionar atleta</b>.</div>`;
  h+=`<div class="list">${ps.map(p=>`<div class="prow${p.active?'':' inactive'}"><span class="ball${p.pos==='GOL'?' gk':''}">${p.num}</span>
    <span class="m"><b>${esc(p.name)}</b><span>${p.pos}${p.active?'':' · fora do elenco ativo'}</span></span>
    <span class="fc pct">FC máx ${p.fcmax||'–'}</span>
    <button class="btn small" data-act="edit-player" data-id="${p.id}">Editar</button></div>`).join('')}</div>`;
  h+=`<div class="section-h"><h2>Comissão técnica</h2><span>aparece no rodapé da minutagem</span></div>
  <div class="staff"><label class="f">Preparador físico<input type="text" id="staff-prep" value="${esc(preparador())}" placeholder="Nome do preparador físico"></label><button class="btn" data-act="save-staff">Salvar</button></div>`;
  h+=`<p class="foot">FC máx é a frequência cardíaca máxima do atleta, usada para calcular as zonas do Polar. Se não souber, use o valor do último teste ou deixe 195.</p>`;
  return h;
}
function editForm(){
  const e=UI.edit;
  return `<form class="form" id="pform" onsubmit="return false">

  </div>
  ${UI.clockAdj&&g.status!=='final'?`<div class="clockadj"><b>Acertar o relógio do ${g.period}º tempo</b>
    <button class="btn small" data-act="clk" data-v="60">+1 min</button><button class="btn small" data-act="clk" data-v="10">+10s</button><button class="btn small" data-act="clk" data-v="1">+1s</button>
    <button class="btn small" data-act="clk" data-v="-1">−1s</button><button class="btn small" data-act="clk" data-v="-10">−10s</button><button class="btn small" data-act="clk" data-v="-60">−1 min</button>

  <div class="row">${g.status==='final'?'':`<button class="btn primary" id="playBtn" data-act="play"></button>

function tokenStyle(g,pid){ const lv=BT.live[pid]; if(!lv) return ''; const p=g.players.find(x=>x.id===pid); return `box-shadow:0 0 0 2px #fff,0 0 0 5px ${zoneColor(lv.bpm,p.fcmax)};`; }
function tabQuadra(g,t){

function statsTable(rowsP,st,tot,team){
  const pass=(ok,err)=>{ const n=ok+err; return n?`${ok}/${n}<span class="pct">${Math.round(ok*100/n)}%</span>`:'–'; };
  const sal=(gf,gs)=>{ if(!gf&&!gs) return '–'; const d=gf-gs; return `<b style="color:${d>0?'var(--good)':d<0?'var(--bad)':'inherit'}">${d>0?'+':''}${d}</b>`; };
  const cards=s=>('<span class="ycard"></span>'.repeat(s.ama)+'<span class="rcard"></span>'.repeat(s.ver))||'–';
  const d=v=>v||'–';
  let h=`<thead><tr><th>Nº</th><th>Atleta</th>${team?'<th>J</th>':''}<th>Min</th><th>Gols</th><th>Assist.</th><th>Part.</th><th>GF</th><th>GS</th><th>Saldo</th><th>Final.</th><th>Passes</th><th>Desarm.</th><th>Faltas C/S</th><th>Defesas</th><th>Cartões</th></tr></thead><tbody>`;
  rowsP.forEach(p=>{ const s=st[p.id];
    h+=`<tr class="${s.min?'':'off'}"><td class="num">${p.num}</td><td>${esc(p.name)} <span class="pct">${p.pos}</span></td>${team?`<td>${s.j}</td>`:''}<td>${s.min?fmt(s.min):'–'}</td><td>${d(s.gol)}</td><td>${d(s.ast)}</td><td>${d(s.gol+s.ast)}</td><td>${d(s.gf)}</td><td>${d(s.gs)}</td><td>${sal(s.gf,s.gs)}</td><td>${s.fin?s.alvo+'/'+s.fin:'–'}</td><td>${pass(s.pok,s.perr)}</td><td>${d(s.des)}</td><td>${s.fc||s.fs?s.fc+'/'+s.fs:'–'}</td><td>${p.pos==='GOL'?d(s.def):''}</td><td>${cards(s)}</td></tr>`; });
  h+=`<tr class="total"><td></td><td>Equipe</td>${team?'<td></td>':''}<td></td><td>${tot.gol}</td><td>${tot.ast}</td><td>${tot.gol+tot.ast}</td><td>${tot.us}</td><td>${tot.them}</td><td>${sal(tot.us,tot.them)}</td><td>${tot.alvo}/${tot.fin}</td><td>${pass(tot.pok,tot.perr)}</td><td>${tot.des}</td><td>${tot.fc}/${tot.fs}</td><td>${tot.def}</td><td></td></tr></tbody>`;
  return `<div class="tablewrap"><table>${h}</table></div>`;
}
function sumTot(st,ids){ const tot={gol:0,ast:0,fin:0,alvo:0,pok:0,perr:0,des:0,fc:0,fs:0,def:0}; ids.forEach(id=>Object.keys(tot).forEach(k=>tot[k]+=st[id][k])); return tot; }
function tabStats(g,t){
  const st=computeStats(g,t), rows=g.players.slice().sort((a,b)=>st[b.id].min-st[a.id].min||a.num-b.num);
  const tot=Object.assign(sumTot(st,rows.map(p=>p.id)),{us:g.score.us,them:g.score.them});
  return statsTable(rows,st,tot,false)+`<p class="foot">Min = tempo em quadra pelo cronômetro do jogo (pausas não contam). Part. = gols + assistências. GF e GS = gols feitos e sofridos com o atleta em quadra; para o goleiro, GS são os gols que ele sofreu. Final. = no alvo / total.</p>
  <div class="row"><button class="btn" data-act="exp-min">Minutagem (Excel)</button><button class="btn" data-act="exp-csv">Planilha de estatísticas (CSV)</button><button class="btn" data-act="exp-pdf">Súmula (PDF)</button><button class="btn" data-act="exp-log">Lances (CSV)</button></div>`;
}

function spark(g,pid){
  const bins=(g.hr&&g.hr[pid])||[], p=g.players.find(x=>x.id===pid), fm=p.fcmax||195;
  const W=480,H=56,lo=60,hi=Math.max(fm,200), y=v=>H-2-(v-lo)/(hi-lo)*(H-4);
  let bands=''; (g.stints[pid]||[]).forEach(([i,o])=>{ const x0=i/(2*PERIOD)*W, x1=(o??gnow(g))/(2*PERIOD)*W; bands+=`<rect x="${x0.toFixed(1)}" y="0" width="${Math.max(1,x1-x0).toFixed(1)}" height="${H}" fill="var(--token)" opacity=".13"/>`; });
  let path='',pen=false; for(let i=0;i<480;i++){ const v=bins[i]; if(v){ path+=(pen?'L':'M')+(i/480*W+.5).toFixed(1)+','+y(v).toFixed(1); pen=true; } else pen=false; }
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Frequência cardíaca ao longo do jogo">${bands}
    <line x1="${W/2}" x2="${W/2}" y1="0" y2="${H}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <line x1="0" x2="${W}" y1="${y(.85*fm).toFixed(1)}" y2="${y(.85*fm).toFixed(1)}" stroke="var(--z4)" stroke-dasharray="4 4" stroke-width="1" vector-effect="non-scaling-stroke"/>
    ${path?`<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`:''}</svg>`;
}

      <div class="hd"><b>${esc(p.name)}</b><span class="live" data-hr="${p.id}">${lv?lv.bpm:'–'}</span><small class="pct">bpm · FC máx ${p.fcmax}</small><span class="spacer"></span>
      ${sen?`<span class="pct">${esc(sen.name)}${sen.lost?' · desconectado':''}</span>${sen.lost?`<button class="btn small" data-act="bt-con" data-id="${p.id}">Religar</button>`:''}<button class="btn small" data-act="bt-dis" data-id="${p.id}">Desconectar</button>`
        :(ready?`<button class="btn small" data-act="bt-con" data-id="${p.id}">Conectar sensor</button>`:'')}
      <span class="btn small fileb">Importar CSV<input type="file" accept=".csv,text/csv" data-import="${p.id}" aria-label="Importar arquivo do Polar de ${esc(p.name)}"></span></div>
      ${m?`<div class="metrics"><span>Média em quadra <b>${m.avgOn??'–'}</b></span><span>Máx <b>${m.max}</b></span><span>Zona alta (≥85%) <b>${m.highPct??'–'}%</b> do tempo em quadra</span><span>Recuperação no banco <b>${m.rec!==null?'−'+m.rec+' bpm':'–'}</b></span></div>${spark(g,p.id)}`
        :'<div class="metrics">Sem dados de frequência cardíaca neste jogo.</div>'}
    </div>`;
  });
  return h+`</div><p class="foot">Recuperação = quanto a frequência caiu entre a saída e a volta à quadra. Zona alta usa 85% da FC máx do cadastro. Para importar, exporte o treino do atleta no Polar Flow em CSV; o app alinha pelo horário em que o cronômetro deste jogo estava rodando.</p>`;
}

function seasonData(){
  const games=Object.values(S.games), st={}, info={};
  games.forEach(g=>{ const s=computeStats(g,gnow(g));
    g.players.forEach(p=>{ info[p.id] ||= {id:p.id,num:p.num,name:p.name,pos:p.pos}; const a=(st[p.id] ||= {j:0,min:0,gol:0,ast:0,gf:0,gs:0,fin:0,alvo:0,pok:0,perr:0,des:0,fc:0,fs:0,ama:0,ver:0,def:0});
      const b=s[p.id]; if(b.min>0) a.j++; Object.keys(b).forEach(k=>a[k]+=b[k]); }); });
  (S.club?S.club.players:[]).forEach(p=>{ if(info[p.id]) Object.assign(info[p.id],{num:p.num,name:p.name,pos:p.pos}); });
  return {games,st,players:Object.values(info)};
}
function viewSeason(){

/* ---------- heat map ---------- */
const GROUP={all:null,chutes:['chute_gol','chute_fora','gol'],passe_ok:['passe_ok'],passe_err:['passe_err'],desarme:['desarme'],faltas:['falta_c','falta_s'],defesa:['defesa']};
function drawMap(events,pid,act){
  const cv=$('#heat'); if(!cv) return; const g=GROUP[act];
  const pts=events.filter(e=>e.x!=null&&(pid==='all'||e.pid===pid)&&(!g||g.includes(e.type))&&!['amarelo','vermelho'].includes(e.type));
  const box=cv.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
  const W=Math.max(1,Math.round(box.width*dpr)), H=Math.max(1,Math.round(box.height*dpr));
  cv.width=W; cv.height=H; const ctx=cv.getContext('2d'); ctx.clearRect(0,0,W,H);
  if(UI.mapView==='heat'&&pts.length){
    const off=document.createElement('canvas'); off.width=W; off.height=H; const o=off.getContext('2d');
    const r=W*.085, a=Math.min(.5,2.4/Math.sqrt(pts.length)+.06);
    pts.forEach(e=>{ const x=e.x*W,y=e.y*H,gr=o.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,`rgba(0,0,0,${a})`); gr.addColorStop(1,'rgba(0,0,0,0)'); o.fillStyle=gr; o.fillRect(x-r,y-r,2*r,2*r); });
    const img=o.getImageData(0,0,W,H), d=img.data;
    const stops=[[0,[255,240,140,0]],[.15,[255,226,60,140]],[.45,[255,150,20,190]],[.8,[235,60,30,215]],[1,[190,20,40,230]]];
    for(let i=0;i<d.length;i+=4){ const v=d[i+3]/255; if(v<.01){d[i+3]=0;continue;} let j=1; while(j<stops.length-1&&v>stops[j][0]) j++;
      const [p0,c0]=stops[j-1],[p1,c1]=stops[j], f=Math.min(1,(v-p0)/(p1-p0)); for(let k=0;k<4;k++) d[i+k]=c0[k]+(c1[k]-c0[k])*f; }
    ctx.putImageData(img,0,0);
  }
  if(UI.mapView==='dots'){
    const cs=getComputedStyle(document.documentElement); const col=k=>{ const m=A[k].c.match(/--[\w-]+/); return m?cs.getPropertyValue(m[0]).trim():'#fff'; };
    pts.forEach(e=>{ ctx.beginPath(); ctx.arc(e.x*W,e.y*H,4.5*dpr,0,Math.PI*2); ctx.fillStyle=col(e.type); ctx.fill(); ctx.lineWidth=1.5*dpr; ctx.strokeStyle='#fff'; ctx.stroke(); });
  }
  const th=[0,0,0]; pts.forEach(e=>th[Math.min(2,Math.floor(e.x*3))]++); const n=pts.length||1;
  $('#thirds').innerHTML=['Defesa','Meio','Ataque'].map((l,i)=>`<div class="third"><div class="l">${l}</div><div class="v">${pts.length?Math.round(th[i]*100/n):0}%</div><div class="bar"><i style="width:${pts.length?th[i]*100/n:0}%"></i></div></div>`).join('');
}

/* ---------- drag & drop ---------- */
function courtRel(cx,cy){ const r=$('#court').getBoundingClientRect(); return {x:(cx-r.left)/r.width,y:(cy-r.top)/r.height,inside:cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom}; }
function findTarget(cx,cy){
  let best=null,bd=1e9;
  document.querySelectorAll('#tokens .tok[data-slot], #tokens .tok[data-empty]').forEach(el=>{ const r=el.getBoundingClientRect(), d=Math.hypot(cx-(r.left+r.width/2),cy-(r.top+r.height/2)); if(d<Math.max(44,r.width)&&d<bd){bd=d;best=el;} });
  return best;
}
document.addEventListener('pointerdown',e=>{
  if(menuCtx&&!e.target.closest('#menu')) closeMenu();
  const el=e.target.closest('#tokens .tok[data-slot], .btok:not(:disabled)'); if(!el||!cur()) return;
  e.preventDefault();
  drag={el,kind:el.classList.contains('btok')?'bench':'court',sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,t0:Date.now(),moved:false,ghost:null,target:null};
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
});
document.addEventListener('pointermove',e=>{
  if(!drag) return;
  drag.lx=e.clientX; drag.ly=e.clientY; drag.t0=Date.now();
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<7) return;
  const g=cur();
  if(!drag.moved){ drag.moved=true;

    else { const p=g.players.find(q=>q.id===drag.el.dataset.pid), gh=document.createElement('div'); gh.className='ghost'+(p.pos==='GOL'?' gk':''); gh.textContent=p.num; document.body.appendChild(gh); drag.ghost=gh; drag.el.classList.add('dim'); } }
  if(drag.kind==='court'){ const r=courtRel(e.clientX,e.clientY); drag.el.style.left=Math.min(1,Math.max(0,r.x))*100+'%'; drag.el.style.top=Math.min(1,Math.max(0,r.y))*100+'%'; }
  else { drag.ghost.style.transform=`translate(${e.clientX}px,${e.clientY}px)`; const tg=findTarget(e.clientX,e.clientY); if(tg!==drag.target){ drag.target&&drag.target.classList.remove('target'); tg&&tg.classList.add('target'); drag.target=tg; } }
});
function endDrag(e,cancel){
  if(!drag) return; const d=drag; drag=null; const g=cur();
  d.ghost&&d.ghost.remove(); d.el.classList.remove('dragging','dim'); d.target&&d.target.classList.remove('target');

    const i=+d.el.dataset.slot, s=g.slots[i];

  play:()=>{ const g=cur(); if(!g) return;
    if(g.clock.since) stopClock(g);
    else { if(g.status==='final'||g.clock.elapsed>=2*PERIOD) return; if(g.period===1&&g.clock.elapsed>=PERIOD) g.period=2; startClock(g); }
    touchGame(g); render(); },
  oppgoal:()=>{ const g=cur(); mutate(g,()=>doOppGoal(g,Math.round(gnow(g)))); toast('Gol do adversário registrado'); },
  oppfoul:()=>{ const g=cur(); mutate(g,()=>push(g,{t:Math.round(gnow(g)),type:'falta_adv'})); const n=countType(g,'falta_adv',g.period); toast(`Falta do adversário · ${n}ª no tempo`); },
  tt:d=>{ const g=cur(); if(countType(g,d.v,g.period)>=1){ toast('Esse tempo técnico já foi usado neste período.'); return; }
    mutate(g,()=>{ stopClock(g); push(g,{t:Math.round(gnow(g)),type:d.v}); }); toast('Tempo técnico · cronômetro pausado'); },
  undo:()=>{ const g=cur(); g&&doUndo(g); },
  'end-game':()=>{ UI.confirm={kind:'end-game'}; render(); },
  'del-game':()=>{ UI.confirm={kind:'del-game'}; render(); },
  reopen:()=>{ const g=cur(); mutate(g,()=>{ g.status='live'; const t=gnow(g); lineup(g).forEach(id=>{ const s=g.stints[id]; if(s&&s.length&&s[s.length-1][1]===t) s[s.length-1][1]=null; }); },{undo:false}); },
  tab:d=>{ UI.tab=d.v; render(); },
  mapview:d=>{ UI.mapView=d.v; render(); },
  delev:d=>{ const g=cur(); const id=+d.id; const e=g.events.find(x=>x.id===id); if(!e) return;
    mutate(g,()=>{ if(e.type==='gol') g.score.us=Math.max(0,g.score.us-1); if(e.type==='gol_adv') g.score.them=Math.max(0,g.score.them-1); g.events=g.events.filter(x=>x.id!==id); }); toast('Lance apagado'); },
  'exp-min':()=>exportMinutagem(cur()),
  'clk-open':()=>{ const g=cur(); if(!g||g.status==='final') return; UI.clockAdj=!UI.clockAdj; render(); },
  'clk-close':()=>{ UI.clockAdj=false; render(); },
  clk:d=>{ const g=cur(); setClockRemaining(g,(g.period*PERIOD-gnow(g))+(+d.v)); },
  'clk-set':()=>{ const g=cur(); const v=String(($('#clk-set')||{}).value||'').trim(); const m=v.match(/^(\d{1,2})(?:[:.,h ]?(\d{2}))?$/);
    if(!m){ toast('Digite o tempo como 12:34'); return; } const s=m[2]!==undefined?(+m[1])*60+(+m[2]):(+m[1])*60;
    if(s>PERIOD){ toast('O tempo vai de 20:00 a 0:00'); return; } setClockRemaining(g,s); toast('Relógio acertado para '+fmt(s)); },
  'save-staff':()=>{ ensureClub(); const v=($('#staff-prep')||{}).value; S.club.preparador=String(v??'').trim(); touchClub(); render(); toast('Comissão técnica salva'); },
  'exp-csv':()=>exportStats(cur()), 'exp-log':()=>exportLog(cur()), 'exp-pdf':()=>exportPDF(cur()),
  'exp-season':()=>{ const {st,players}=seasonData(); const head=['Nº','Atleta','Posição','Jogos','Minutos','Gols','Assistências','Participações','GF em quadra','GS em quadra','Saldo','Finalizações','No alvo','Passes certos','Passes errados','Desarmes','Faltas cometidas','Faltas sofridas','Defesas','Amarelos','Vermelhos'];
    saveFile(`${slug(clubName())}-temporada.csv`,csv([head,...players.sort((a,b)=>a.num-b.num).map(p=>{ const s=st[p.id]; return [p.num,p.name,p.pos,s.j,fmt(s.min),s.gol,s.ast,s.gol+s.ast,s.gf,s.gs,s.gf-s.gs,s.fin,s.alvo,s.pok,s.perr,s.des,s.fc,s.fs,s.def,s.ama,s.ver]; })])); },
  'bt-con':d=>connectHR(d.id), 'bt-dis':d=>disconnectHR(d.id)
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const f=ACT[b.dataset.act]; if(f){ e.preventDefault(); f(b.dataset); }
});
function setPath(path,val){ const [o,k]=path.split('.'); if(k===undefined) UI[o]=val; else if(UI[o]) UI[o][k]=val; }
document.addEventListener('input',e=>{ const b=e.target.dataset&&e.target.dataset.bind; if(!b) return; setPath(b,e.target.type==='checkbox'?e.target.checked:e.target.value);
  if(b==='setup.opp'){ const ok=UI.setup.opp.trim()&&UI.setup.starters.length===5; const st=$('[data-act="start"]'); if(st) st.disabled=!ok; } });
document.addEventListener('change',e=>{
  const b=e.target.dataset&&e.target.dataset.bind;
  if(b){ setPath(b,e.target.type==='checkbox'?e.target.checked:e.target.value); if(/Player|Action/.test(b)) afterRender(); if(b==='setup.date') return; }
  const imp=e.target.dataset&&e.target.dataset.import; if(imp&&e.target.files[0]){ importHR(imp,e.target.files[0]); e.target.value=''; }
});
document.addEventListener('focusout',()=>{ setTimeout(()=>{ if(needRender&&!drag&&!menuCtx){ const a=document.activeElement; if(!a||!/INPUT|SELECT|TEXTAREA/.test(a.tagName)) render(); } },50); });
addEventListener('resize',()=>{ if($('#heat')) afterRender(); });

/* ---------- tick ---------- */
let lastSec=0, lastHRSave=Date.now();
function tick(){
  const g=cur(); if(!g) return;
  if(g.clock.since){
    const t=gnow(g), end=g.period*PERIOD;
    if(t>=end){ stopClock(g,end); touchGame(g); toast(g.period===1?'Fim do 1º tempo':'Fim do tempo regulamentar. Toque em Encerrar jogo.'); render(); return; }
  }
  const t=gnow(g); let freed=false;
  g.slots.forEach(s=>{ if(s.red&&t>=s.red.until){ s.red=null; freed=true; } });
  if(freed){ touchGame(g); toast('Inferioridade encerrada: complete com alguém do banco'); render(); return; }
  renderClock(g);
  document.querySelectorAll('[data-hr]').forEach(el=>{ const lv=BT.live[el.dataset.hr]; if(lv) el.textContent=lv.bpm; });
  document.querySelectorAll('[data-hrtok]').forEach(el=>{ const pid=el.dataset.hrtok; el.style.boxShadow=BT.live[pid]?tokenStyle(g,pid).replace('box-shadow:','').replace(';',''):''; });
  if(Date.now()-lastSec>1000){ lastSec=Date.now();
    if(g.clock.since) document.querySelectorAll('[data-min]').forEach(el=>{ if(!g.expelled[el.dataset.min]) el.textContent=fmt(minutes(g,el.dataset.min,t)); });
    if(g.clock.since&&UI.tab==='stats'&&!drag&&!menuCtx&&Date.now()%4000<1100) softRender();
  }
  if(BT.dirty&&Date.now()-lastHRSave>10000){ BT.dirty=false; lastHRSave=Date.now(); touchGame(g); }
}

/* ---------- boot ---------- */
loadLocal();
if(!S.club&&!Object.keys(S.games).length&&!(window.claude&&window.claude.use)){ const g=sampleGame(sampleClub()); S.games[g.id]=g; S.club=realClub(); saveLocal(); }
else if(S.club&&!S.club.players.some(p=>/^cm\d+$/.test(p.id))&&(S.club.example||S.club.players.every(p=>/^p\d+$/.test(p.id)))){ S.club=realClub(S.club); saveLocal(); if(window.claude&&window.claude.use) setTimeout(()=>queueWrite('clube/principal'),12000); }
render();
setInterval(tick,250);
initSync();
</script>
</body></html>
